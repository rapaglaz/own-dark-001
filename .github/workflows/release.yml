# Packages the extension for a version tag, creates the GitHub Release with the notes of that
# version from git-cliff and publishes the extension to the Marketplace.
# The tag itself is created and signed locally by scripts/release.sh.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff needs the history and the tags to find the commits of this version.
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17

      - name: Install dependencies
        run: mise run install

      - name: Quality check
        run: mise run format:check

      - name: Create release notes
        run: git cliff --latest --strip all --output release-notes.md

      # File name without the "v", the same as in the former releases.
      - name: Package extension
        run: |
          echo "VSIX=own-dark-001-${GITHUB_REF_NAME#v}.vsix" >> "$GITHUB_ENV"
          pnpm exec vsce pack --no-dependencies -o "own-dark-001-${GITHUB_REF_NAME#v}.vsix"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$VSIX" --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath "$VSIX"
