# Output must match the format of the existing CHANGELOG.md entries,
# because new releases are prepended and old entries are never regenerated.

[changelog]
body = """
{% set repo_url = "https://github.com/rapaglaz/own-dark-001" -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo_url }}/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits | sort(attribute="message") | sort(attribute="scope") -%}
* {% if commit.scope != "~" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo_url }}/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
# Keep the trailing blank line, so that a prepended entry stays separated from the previous one.
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/rapaglaz/own-dark-001/issues/${1}))" },
]
# Same visible types as the former semantic-release config; all others are hidden.
# Tera cannot sort null values, so unscoped commits get "~", which sorts after
# all scopes (same order as semantic-release) and is hidden in the template.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(feat|fix|style|docs|refactor)", group = "Changes", default_scope = "~" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
# Former releaseRules with "release: false".
no_increment_regex = "^(chore|ci|test|perf|build)"
